services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: forgeops_local
      POSTGRES_DB: forgeops
    ports:
      - "5432:5432"
    volumes:
      - forgeops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeops -d forgeops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forgeops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - forgeops_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forgeops_postgres:
  forgeops_redis:
